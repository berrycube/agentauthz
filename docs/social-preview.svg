<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#11182e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#41d1ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <!-- Wordmark -->
  <text x="80" y="118" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Agent<tspan fill="#41d1ff">AuthZ</tspan></text>

  <!-- Subtitle -->
  <text x="82" y="168" font-size="27" font-weight="500" fill="#aab4cf">Broken authorization &amp; business-logic in AI agents —</text>
  <text x="82" y="204" font-size="27" font-weight="500" fill="#aab4cf">the bugs your prompt-injection scanner can't see.</text>

  <!-- Killer line -->
  <text x="80" y="312" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1">Across models, code is the</text>
  <text x="80" y="372" font-size="50" font-weight="800" letter-spacing="-1" xml:space="preserve"><tspan fill="#ffffff">only </tspan><tspan fill="#41d1ff">reliable control.</tspan></text>

  <!-- Result chips -->
  <g font-weight="700">
    <!-- read class -->
    <rect x="80" y="430" width="356" height="92" rx="14" fill="#2a1418" stroke="#ff5a5f" stroke-width="2"/>
    <text x="104" y="466" font-size="20" fill="#ff8a8e" font-weight="800">READ  ·  V2 / V5</text>
    <text x="104" y="503" font-size="25" fill="#ffffff" font-weight="800">5/5 leaked <tspan fill="#ff6b70">· every model</tspan></text>

    <!-- write class -->
    <rect x="462" y="430" width="356" height="92" rx="14" fill="#2a2410" stroke="#f5b94a" stroke-width="2"/>
    <text x="486" y="466" font-size="20" fill="#f7cd7a" font-weight="800">WRITE  ·  V3 / V4 / V6</text>
    <text x="486" y="503" font-size="25" fill="#ffffff" font-weight="800">splits on <tspan fill="#f5b94a">alignment</tspan></text>

    <!-- fixed class -->
    <rect x="844" y="430" width="356" height="92" rx="14" fill="#0f2418" stroke="#3fb950" stroke-width="2"/>
    <text x="868" y="466" font-size="20" fill="#6fd585" font-weight="800">fixed/  ·  code controls</text>
    <text x="868" y="503" font-size="25" fill="#ffffff" font-weight="800">0/5 <tspan fill="#3fb950">· all models</tspan></text>
  </g>

  <!-- Footer badges -->
  <g font-size="22" font-weight="600" fill="#8a93ad">
    <text x="80" y="586">OWASP ASI02 / ASI03</text>
    <text x="392" y="586" fill="#41506e">·</text>
    <text x="416" y="586">self-built target</text>
    <text x="664" y="586" fill="#41506e">·</text>
    <text x="688" y="586">offline &amp; reproducible</text>
  </g>
</svg>

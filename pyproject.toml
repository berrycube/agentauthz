[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentauthz"
version = "0.0.1"
description = "AgentAuthZ — a deliberately vulnerable AI agent + business-logic/authorization red-team harness (security education / demo)."
requires-python = ">=3.11"
dependencies = [
    # v1 — declarative scenarios
    "pyyaml",
    # framework target + OpenTelemetry observation; local models via Ollama
    "langgraph",
    "langchain-ollama",
    "opentelemetry-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["agentauthz*"]

# ---- Quality gates ----

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "B", "I", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["agentauthz"]
addopts = "--timeout=120 --timeout-method=signal"
